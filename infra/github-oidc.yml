AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC provider and deployment role for the Elastic Beanstalk lab.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub owner or organization name.
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
  BucketName:
    Type: String
    Description: S3 bucket used to store Elastic Beanstalk source bundles.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: beanstalk-demo

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-actions-${GitHubOrg}-${GitHubRepo}-beanstalk-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: BeanstalkDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}
              - Sid: S3ObjectUpload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/*
              - Sid: ManageElasticBeanstalkVersions
                Effect: Allow
                Action:
                  - elasticbeanstalk:CreateApplicationVersion
                  - elasticbeanstalk:UpdateEnvironment
                  - elasticbeanstalk:DescribeApplications
                  - elasticbeanstalk:DescribeApplicationVersions
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticbeanstalk:DescribeEvents
                Resource: "*"
      Tags:
        - Key: Project
          Value: beanstalk-demo

Outputs:
  RoleArn:
    Description: GitHub Actions role ARN to store as the AWS_ROLE_ARN repository variable.
    Value: !GetAtt GitHubActionsDeployRole.Arn
