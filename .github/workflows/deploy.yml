name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
  EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
  EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -q --no-transfer-progress

      - name: Generate version label
        id: version
        run: |
          VERSION="v$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "label=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=beanstalk-demo-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Package source bundle
        run: |
          mkdir -p bundle
          cp target/beanstalk-demo.jar bundle/
          cp Procfile bundle/
          [ -d .ebextensions ] && cp -r .ebextensions bundle/ || true
          printf 'app.version=%s\n' '${{ steps.version.outputs.label }}' > bundle/application.properties
          cd bundle
          zip -r "../${{ steps.version.outputs.bundle }}" .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload bundle to S3
        run: |
          aws s3 cp "${{ steps.version.outputs.bundle }}" \
            "s3://${{ env.S3_DEPLOY_BUCKET }}/${{ steps.version.outputs.bundle }}"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ steps.version.outputs.label }}" \
            --source-bundle "S3Bucket=${{ env.S3_DEPLOY_BUCKET }},S3Key=${{ steps.version.outputs.bundle }}" \
            --description "Deployed from ${{ github.sha }} by ${{ github.actor }}"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ steps.version.outputs.label }}"

      - name: Wait for deployment to complete
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}"
          echo "Deployment complete: ${{ steps.version.outputs.label }}"
